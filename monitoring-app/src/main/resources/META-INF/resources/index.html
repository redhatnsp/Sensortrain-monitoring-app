<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>ShadowTrain Monitor</title>
</head>
<body>
    <div id="frame-container">
        <div id="header">
            <h1>ShadowTrain Monitor</h1>
            <img id="train-id" src="train.png" alt="Train image">
        </div>
        
        <div id="image-frame">
            <img id="stream-image" src="empty-state.png" alt="Stream image">
        </div>
        <!--
        <div id="commands-container">
            <img id="commands" src="commands.png" alt="Commands graphic">
        </div>
        -->
        <!-- Properly structured flex container -->
        <div id="button-frame">
            <div id="button-frame1">
                <button onclick="startCapture()" class="button-82-pushable" type="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">Start Camera</span>
                </button>
            </div>
            
            <div id="button-frame2">
                <button onclick="stopCapture()" class="button-82-pushable" type="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">Stop Camera</span>
                </button>
            </div>
            
            <div id="button-frame3">
                <button onclick="connectReconnect()" class="button-82-pushable" type="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">Connect/Reconnect Train</span>
                </button>
            </div>
            
            <div id="button-frame4">
                <button onclick="stopMovement()" class="button-82-pushable" type="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">Stop Train Movement</span>
                </button>
            </div>
            
            <div id="button-frame5">
                <button onclick="startMovement()" class="button-82-pushable" type="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">Start Train Movement</span>
                </button>
            </div>
        </div>
    </div> <!-- #frame-container closing tag restored -->

    <script>
        function startMovement() {
            fetch('/capture/startMovement', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: "startMovement" })
            });
        }

        function stopMovement() {
            fetch('/capture/stopMovement', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: "stopMovement" })
            });
        }

        function startCapture() {
            fetch('/capture/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: "start" })
            });
        }

        function stopCapture() {
            fetch('/capture/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: "stop" })
            });
        }

        function connectReconnect() {
            fetch('/capture/connectReconnect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: "connectReconnect" })
            });
        }

        let lastImageTime = null;

        function startImageStream() {
            const source = new EventSource('/train-monitoring');
            source.onmessage = function(event) {
                document.getElementById('stream-image').src = event.data; 
                lastImageTime = new Date().getTime();
            };
        }
      
        startImageStream();
    </script>
</body>
</html>
